keytab = NOT_KERBEROS_CONTROLLED
authenticate = False
filter_by_owner = False
owner_mode = user
secure_mode = False
colored_console_log = True
colored_log_format = [%%(blue)s%%(asctime)s%%(reset)s] {{%%(green)s%%(levelname)s%%(reset)s}} %%(name)s - %%(message)s
colored_formatter_class = airflow.utils.log.colored_log.CustomTTYColoredFormatter
log_format = [%%(asctime)s] {{%%(levelname)s}} %%(name)s - %%(message)s
simple_log_format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(message)s
task_runner = StandardTaskRunner
default_impersonation = 
xcom_enabled = True
lazy_load_plugins = True
enable_sql_profiling = False
hide_sensitive_var_conn_fields = True
sensitive_var_conn_names = 

[logging]
base_log_folder = /opt/airflow/logs
remote_logging = False
remote_base_log_folder = 
logging_level = INFO
fab_logging_level = WARN
logging_config_class = 
colored_console_log = True
colored_log_format = [%%(blue)s%%(asctime)s%%(reset)s] {{%%(green)s%%(levelname)s%%(reset)s}} %%(name)s - %%(message)s
colored_formatter_class = airflow.utils.log.colored_log.CustomTTYColoredFormatter
