server.port=8081

# Keycloak Configuration
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:reports-realm}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:reports-frontend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}

# Session Configuration
session.max-age=1800 # 30 minutes in seconds

# Logging
logging.level.com.bionicpro.auth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Actuator for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never